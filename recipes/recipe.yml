# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: alfatangos
# description will be included in the image's metadata
description: My personal OS image starting from a blank ublue os base.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into your image's root folder /

  - type: dnf
    repos:
      copr:
        # COPR for Niri
        - yalter/niri
        # COPR for Ghostty terminal
        - scottames/ghostty
        # Official COPR for Dank Material Shell (Stable)
        - avengemedia/dms

    install:
      packages:
        # --- Window Manager & Terminal ---
        - niri
        - ghostty
        - xwayland-satellite # Often needed by Niri for legacy X11 app support
        - quickshell

        # --- Dank Material Shell ---
        - dms
        - dms-greeter

        # --- Recommended Extras for DMS/Wayland ---
        - cava
        - matugen
        - qt6ct-kde
        - qt6-qtmultimedia
        - dsearch
        - greetd
        - tuned
        - tuned-ppd
        - cups-pk-helper
        - kf6-kimageformats
        - adw-gtk3-theme
        - nautilus
        - vlc

    remove:
      packages:
        - alacritty
        - waybar
        - firefox

  - type: containerfile
    snippets:
      - "RUN authselect enable-feature with-mkhomedir || true"
      - "RUN useradd -m -G wheel -s /bin/bash giacomo && echo 'giacomo:giacomo' | chpasswd && chage -d 0 giacomo"

  - type: systemd
    system:
      enabled:
        - greetd.service
        - tuned.service
        - cups.service
    user:
      enabled:
        - dms.service

  - type: brew
    nofile-limits: true
    brew-analytics: false

  - type: default-flatpaks
    configurations:
      - scope: user
        notify: true
        install:
          - org.mozilla.firefox
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - io.missioncenter.MissionCenter
          - org.gnome.Evince
          - org.gnome.Loupe
          - com.ranfdev.DistroShelf
          - com.nextcloud.desktopclient.nextcloud
          - org.chromium.Chromium

  - type: signing
