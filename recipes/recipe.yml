# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: alfatangos
# description will be included in the image's metadata
description: My personal OS image starting from a blank ublue os base.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      copr:
        # COPR for Niri
        - yalter/niri
        # COPR for Ghostty terminal
        - scottames/ghostty
        # Official COPR for Dank Material Shell (Stable)
        - avengemedia/dms

    install:
      packages:
        # --- Window Manager & Terminal ---
        - niri
        - ghostty
        - xwayland-satellite # Often needed by Niri for legacy X11 app support
        - quickshell
 
        # --- Dank Material Shell ---
        # This package automatically pulls in Quickshell, DGOP, fonts, and other core dependencies
        - dms
        # Optional: The official DMS login screen (replaces standard GDM/SDDM)
        - dms-greeter
 
        # --- Recommended Extras for DMS/Wayland ---
        - cava            # Audio visualizer for the shell
        - matugen         # Material design color generator (for dynamic theming)
        - qt6ct           # Qt6 application theming
        - qt6-qtmultimedia
        - dsearch
        - greetd
 
  - type: containerfile
    snippets:
      # --- Force Anaconda to ask for User Creation ---
      # Silverblue base disables this by default. This override forces it back on.
      - "RUN mkdir -p /etc/systemd/system/installer.service.d/ && echo -e '[Service]\\nEnvironment=ANACONDA_MODULES_ENABLED=users' > /etc/systemd/system/installer.service.d/override.conf"      # --- Configure Greetd to use DMS Greeter ---
      - "RUN dms-greeter enable || true"
        
  - type: systemd
    system:
      enabled:
        - greetd.service

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
